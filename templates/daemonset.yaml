apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.vendor }}-vfio-manager
  namespace: {{ .Values.vendor }}
  labels:
    app: {{ .Values.vendor }}-vfio-manager
spec:
  selector:
    matchLabels:
      name: {{ .Values.vendor }}-vfio-manager
  template:
    metadata:
      labels:
        name: {{ .Values.vendor }}-vfio-manager
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: {{ .Values.vendor }}-vfio-manager
      containers:
        - name: {{ .Values.vendor }}-vfio-manager
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - /bin/vfio-manage.sh bind --all && sleep inf
          resources:
            limits:
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 200Mi
          volumeMounts:
          - name: {{ .Values.vendor }}-vfio-manager
            readOnly: true
            mountPath: /bin/vfio-manage.sh
            subPath: vfio-manage.sh
          - name: host-sys
            mountPath: /sys
          - name: host-root
            mountPath: /host
          securityContext:
            privileged: true
            seLinuxOptions:
              level: "s0"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "/bin/vfio-manage.sh unbind --all"]
      terminationGracePeriodSeconds: 30
      volumes:
        - name: {{ .Values.vendor }}-vfio-manager
          configMap:
            name: {{ .Values.vendor }}-vfio-manager
            defaultMode: 448
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-root
          hostPath:
            path: "/"
