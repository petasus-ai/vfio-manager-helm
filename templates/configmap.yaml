apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.vendor }}-vfio-manager
  namespace: {{ .Values.vendor }}
  labels:
    app: {{ .Values.vendor }}-vfio-manager
data:
  vfio-manage.sh: |-
    #!/bin/bash

    set -eu

    usage()
    {
        cat >&2 <<EOF
    Usage: $0 COMMAND [ARG...]

    Commands:
      bind   [-a | --all] [-d | --device-id]
      unbind [-a | --all] [-d | --device-id]
      help [-h]
    EOF
        exit 0
    }

    unbind_from_driver() {
        local xpu=$1
        local existing_driver_name
        local existing_driver

        [ -e "/sys/bus/pci/devices/$xpu/driver" ] || return 0

        existing_driver=$(readlink -f "/sys/bus/pci/devices/$xpu/driver")
        existing_driver_name=$(basename "$existing_driver")

        echo "unbinding device $xpu from driver $existing_driver_name"
        echo "$xpu" > "$existing_driver/unbind"
        echo > /sys/bus/pci/devices/$xpu/driver_override
    }

    # unbind device from non vfio-pci driver
    unbind_from_other_driver() {
        local xpu=$1
        local existing_driver_name
        local existing_driver

        [ -e "/sys/bus/pci/devices/$xpu/driver" ] || return 0

        existing_driver=$(readlink -f "/sys/bus/pci/devices/$xpu/driver")
        existing_driver_name=$(basename "$existing_driver")

        # return if bound to vfio-pci
        [ "$existing_driver_name" != "vfio-pci" ] || return 0
        echo "unbinding device $xpu from driver $existing_driver_name"
        echo "$xpu" > "$existing_driver/unbind"
        echo > /sys/bus/pci/devices/$xpu/driver_override
    }

    is_target_xpu_device() {
        local xpu=$1
        # make sure device class is for target xpu
        device_class_file=$(readlink -f "/sys/bus/pci/devices/$xpu/class")
        device_class=$(cat "$device_class_file")

        # make sure device is for target xpu
        device_file=$(readlink -f "/sys/bus/pci/devices/$xpu/device")
        device=$(cat "$device_file")

        # Iterate over each xpu entry defined in Helm values.
        {{- range .Values.xpu }}
        # Check if the device class matches.
        if [ "$device_class" == "{{ .deviceClass }}" ]; then
            {{- if .device }}
            # If a device is specified, check that it matches.
            if [ "$device" == "{{ .device }}" ]; then
                return 0
            fi
            {{- else }}
            # If no device value is provided in this entry, then a class match is enough.
            return 0
            {{- end }}
        fi
        {{- end }}

        # If no entry matches, return 1.
        return 1
    }

    is_bound_to_vfio() {
        local xpu=$1
        local existing_driver_name
        local existing_driver

        # return if not bound to any driver
        [ -e "/sys/bus/pci/devices/$xpu/driver" ] || return 1

        existing_driver=$(readlink -f "/sys/bus/pci/devices/$xpu/driver")
        existing_driver_name=$(basename "$existing_driver")

        echo "existing driver is $existing_driver_name"
        # return if bound to other drivers(nvidia, nouveau)
        [ "$existing_driver_name" == "vfio-pci" ] || return 1

        # bound to vfio
        return 0
    }

    unbind_device() {
        local xpu=$1

        if ! is_target_xpu_device $xpu; then
            return 0
        fi

        echo "unbinding device $xpu"
        unbind_from_driver $xpu
    }

    unbind_all() {
        for dev in /sys/bus/pci/devices/*; do
            read vendor < $dev/vendor
            if [ "$vendor" = "{{ .Values.vendorID }}" ]; then
                local dev_id=$(basename $dev)
                unbind_device $dev_id
            fi
        done
    }

    bind_pci_device() {
        local xpu=$1

        if ! is_bound_to_vfio $xpu; then
          unbind_from_other_driver $xpu
          echo "binding device $xpu"
          echo "vfio-pci" > /sys/bus/pci/devices/$xpu/driver_override
          echo "$xpu" > /sys/bus/pci/drivers/vfio-pci/bind
        else
          echo "device $xpu already bound to vfio-pci"
        fi
    }

    bind_device() {
        local xpu=$1

        if ! is_target_xpu_device $xpu; then
            echo "device $xpu is not a xpu!"
            return 0
        fi

        bind_pci_device "$xpu"
    }

    bind_all() {
        for dev in /sys/bus/pci/devices/*; do
            read vendor < $dev/vendor
            if [ "$vendor" = "{{ .Values.vendorID }}" ]; then
                local dev_id=$(basename $dev)
                bind_device $dev_id
            fi
        done
    }

    handle_bind() {
        chroot /host modprobe vfio-pci
        if [ "$DEVICE_ID" != "" ]; then
            bind_device $DEVICE_ID
        elif [ "$ALL_DEVICES" = "true" ]; then
            bind_all
        else
            usage
        fi
    }

    handle_unbind() {
        if [ "$DEVICE_ID" != "" ]; then
            unbind_device $DEVICE_ID
        elif [ "$ALL_DEVICES" = "true" ]; then
            unbind_all
        else
            usage
        fi
    }

    if [ $# -eq 0 ]; then
        usage
    fi

    command=$1; shift
    case "${command}" in
        bind) options=$(getopt -o ad: --long all,device-id: -- "$@");;
        unbind) options=$(getopt -o ad: --long all,device-id: -- "$@");;
        help) options="" ;;
        *) usage ;;
    esac
    if [ $? -ne 0 ]; then
        usage
    fi

    eval set -- "${options}"

    DEVICE_ID=""
    for opt in ${options}; do
        case "$opt" in
        -a | --all) ALL_DEVICES=true; shift 1 ;;
        -d | --device-id) DEVICE_ID=$2; shift 2 ;;
        -h | --help) shift;;
        --) shift; break ;;
        esac
    done
    if [ $# -ne 0 ]; then
        usage
    fi

    if [ "$command" = "help" ]; then
        usage
    elif [ "$command" = "bind" ]; then
        handle_bind
    elif [ "$command" = "unbind" ]; then
        handle_unbind
    else
      echo "Unknown function: $command"
      exit 1
    fi
